destination_task:
  description: >
    Read the user's latest travel request: "{user_request}"
    Also, review the conversation history for context: "{chat_history}"
    
    Extract their desired destination, duration, and vibe from this text. 
    If they didn't specify an exact destination, select ONE perfect target destination that matches their vibe. 
    Then, list the top 5 must-do activities for that specific location.
  expected_output: "The name of the destination city/region and a bulleted list of 5 activities."
  agent: destination_expert

route_task:
  description: >
    Based on the destination chosen in the previous task, figure out the best travel options.
    Look at the user's request ("{user_request}") and history ("{chat_history}") to see if they mentioned a starting origin.
    
    If an origin is mentioned, provide 2-3 general ways to get from there to the destination (e.g., flights, trains, driving). 
    If no origin is mentioned, provide general travel advice on how to reach the destination from major international hubs.
  expected_output: "A short summary of the best travel routes and modes of transportation."
  agent: route_coordinator

itinerary_task:
  description: >
    Take the destination and activities from the Destination Expert, and the travel routes from the Route Coordinator.
    Look at the user's request ("{user_request}") to determine how many days the trip should be.
    
    Combine all of this into a seamless, day-by-day itinerary matching their requested duration. 
    Ensure travel time is factored into the first and last days.
  expected_output: >
    A comprehensive, beautifully formatted Markdown itinerary.
    CRITICAL FORMATTING RULES:
    1. DO NOT use tables under any circumstances.
    2. Use H2 headers for each day (e.g., ## Day 1: Arrival).
    3. Use a short introductory paragraph for the day's vibe.
    4. Use simple bullet points for activities, with the time in bold (e.g., * **09:00 AM - Morning Tour:** Walk around the city).
    5. Write in a warm, exciting, and highly readable travel-blog style.
  agent: itinerary_planner